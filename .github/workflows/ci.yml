name: CI

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  # Cancel in progress runs on this workflow if not running on the main branch.
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node

      - name: Test
        run: make test

  validate-no-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node
      - uses: ./.github/actions/setup_python

      - name: Ensure clean dist diff
        run: make validate-no-changes

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diffs
          path: /tmp/diffs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node

      - name: Lint
        run: make lint

  check-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node

      - name: Check formatting
        run: make autoformat-all-no-fix

  check-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-version-check')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup_node
      - name: Fetch main branch
        run: git fetch origin main
      - name: Check version bump
        run: ./scripts/dev/check-version-updated.sh

  validate-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup_node

      - name: Validate samples
        run: make validate-samples

  publish-docs-head:
    if: github.ref_name == 'main'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      env: head
      site-url: https://docs.qa-sh.io/packs/build/latest/
      role-to-assume: arn:aws:iam::020355488663:role/automation/CICDRole

  publish-docs-staging:
    if: github.actor != 'github-actions[bot]'
    needs: publish-docs-head
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      env: staging
      site-url: https://docs.pp-sh.io/packs/build/latest/
      role-to-assume: arn:aws:iam::053716345611:role/automation/CICDRole

  publish-docs-prod:
    if: github.actor != 'github-actions[bot]'
    needs: publish-docs-staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      env: prod
      site-url: https://docs.superhuman.com/packs/build/latest/
      role-to-assume: arn:aws:iam::029208794193:role/automation/CICDRole
