name: Publish SDK release
on:
  push:
    branches: [main]
    paths: [package.json, CHANGELOG.md]
  workflow_dispatch:
    inputs:
      release-pr:
        description: 'Merged PR # created by Prepare SDK release. Run on main; validation and publication use its original merge commit.'
        required: true
        type: string
      dry-run:
        description: 'Validate the package without publishing, tagging, or creating a GitHub release (dry run)'
        default: true
        type: boolean
      skip-npm:
        description: 'I have verified this version is already staged or published; skip npm submission'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: packs-sdk-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      eligible: ${{ steps.inspect.outputs.eligible }}
      sha: ${{ steps.inspect.outputs.sha }}
      pr: ${{ steps.inspect.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - id: inspect
        run: node .github/releases/release.cjs inspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ inputs.release-pr }}
  validate:
    needs: inspect
    if: needs.inspect.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup_node
        with:
          cache: 'false'
          frozen-lockfile: 'true'
      - uses: ./.github/actions/setup_python
      - run: make test lint autoformat-all-no-fix validate-samples validate-no-changes
  publish:
    needs: [inspect, validate]
    if: >-
      needs.inspect.outputs.eligible == 'true' &&
      vars.PACKS_SDK_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.dry-run == false)
    runs-on: ubuntu-latest
    environment: sdk-release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup_node
        with:
          cache: 'false'
          frozen-lockfile: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Stage npm package and create GitHub draft
        run: |
          if [[ "$RELEASE_SKIP_NPM" != true ]]; then
            if [[ -z "$NPM_TOKEN" ]]; then
              echo '::error::Set NPM_TOKEN in the sdk-release environment to a granular npm token with stage-only access to @codahq/packs-sdk.'
              exit 1
            fi
            umask 077
            # npm expands this placeholder when reading the config.
            # shellcheck disable=SC2016
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          fi
          node .github/releases/release.cjs publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/packs-sdk-publish.npmrc
          RELEASE_SKIP_NPM: ${{ inputs.skip-npm || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKS_SDK_PUBLISH_ENABLED: ${{ vars.PACKS_SDK_PUBLISH_ENABLED }}
          RELEASE_DRY_RUN: 'false'
