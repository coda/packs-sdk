name: Publish SDK release (OIDC diagnostic)
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Authentication diagnostics only; no package submission'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  diagnose:
    if: inputs.dry-run == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: make _bootstrap-install-pnpm
      - run: node .github/releases/diagnose-oidc.cjs
